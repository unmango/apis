version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/unmango/apis/go

plugins:
  - local: protoc-gen-go
    out: go
    opt:
      - paths=source_relative

inputs:
  - directory: proto
    paths:
      - proto/unmango
      # dev.unmango.cli moved here out of the life-domain namespace and still
      # needs generated code; the rest of proto/dev/unmango does not.
      - proto/dev/unmango/cli
