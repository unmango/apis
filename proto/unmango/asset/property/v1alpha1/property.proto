edition = "2024";

package unmango.asset.property.v1alpha1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "google/type/latlng.proto";
import "google/type/money.proto";
import "google/type/postal_address.proto";
import "k8s.io/apimachinery/pkg/apis/meta/v1/generated.proto";
import "unmango/ref/v1alpha1/ref.proto";

// Places, and the rooms inside them:
//
//   Property -> Space
//
// A Space is the unit that other domains bind to: a compute.host Host sits in
// one, an asset.vehicle Vehicle parks in one, a calendar.event Event is held
// in one. A garage is both a PropertyType, when it stands alone, and a
// SpaceType, when it is part of a house.

// ---------------------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------------------

enum PropertyType {
  PROPERTY_TYPE_UNSPECIFIED = 0;
  PROPERTY_TYPE_HOUSE = 1;
  PROPERTY_TYPE_APARTMENT = 2;
  PROPERTY_TYPE_CONDO = 3;
  PROPERTY_TYPE_TOWNHOUSE = 4;
  PROPERTY_TYPE_DETACHED_GARAGE = 5;
  PROPERTY_TYPE_SHED = 6;
  PROPERTY_TYPE_STORAGE_UNIT = 7;
  PROPERTY_TYPE_LAND = 8;
  PROPERTY_TYPE_OFFICE = 9;
}

enum SpaceType {
  SPACE_TYPE_UNSPECIFIED = 0;
  SPACE_TYPE_BEDROOM = 1;
  SPACE_TYPE_BATHROOM = 2;
  SPACE_TYPE_KITCHEN = 3;
  SPACE_TYPE_LIVING_ROOM = 4;
  SPACE_TYPE_DINING_ROOM = 5;
  SPACE_TYPE_OFFICE = 6;
  SPACE_TYPE_GARAGE = 7;
  SPACE_TYPE_BASEMENT = 8;
  SPACE_TYPE_ATTIC = 9;
  SPACE_TYPE_UTILITY = 10;
  SPACE_TYPE_CLOSET = 11;
  SPACE_TYPE_OUTDOOR = 12;

  // Rack, closet, or room housing compute.host Hosts.
  SPACE_TYPE_SERVER_ROOM = 13;
}

// How the property is held.
enum TenureType {
  TENURE_TYPE_UNSPECIFIED = 0;
  TENURE_TYPE_OWNED_OUTRIGHT = 1;
  TENURE_TYPE_MORTGAGED = 2;
  TENURE_TYPE_RENTED = 3;
  TENURE_TYPE_LEASED = 4;
}

// A measurement with its unit, kept local to this package so the domain
// versions independently.
message Area {
  double value = 1;
  AreaUnit unit = 2;
}

enum AreaUnit {
  AREA_UNIT_UNSPECIFIED = 0;
  AREA_UNIT_SQUARE_METER = 1;
  AREA_UNIT_SQUARE_FOOT = 2;
}

// ---------------------------------------------------------------------------
// Space
// ---------------------------------------------------------------------------

// A room or defined area inside a Property. The unit other domains bind to.
message Space {
  option (google.api.resource) = {
    type: "unmango.asset.property/Space"
    pattern: "{space}"
    singular: "space"
    plural: "spaces"
  };
  string name = 1 [(google.api.field_behavior) = IMMUTABLE];
  string uid = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string display_name = 3 [(google.api.field_behavior) = OPTIONAL];
  map<string, string> labels = 4;
  map<string, string> annotations = 5;
  repeated k8s.io.apimachinery.pkg.apis.meta.v1.OwnerReference owner_refs = 6;
  int64 generation = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp delete_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Desired state.
  SpaceType type = 10;
  Area area = 11;

  // Storey the space is on. Zero is ground level, negative is below it.
  int32 floor = 12;

  // People or things that can occupy it at once. Zero means unbounded.
  int32 capacity = 13;

  // Available for calendar.event Events to be held in.
  bool bookable = 14;

  // Observed state.
  int64 observed_generation = 50 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated k8s.io.apimachinery.pkg.apis.meta.v1.Condition conditions = 51 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Resources from any domain currently bound here: Hosts, Vehicles, Events.
  int32 occupant_count = 52 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Desired state stamped onto Spaces generated by a Property. Field numbers
// mirror Space 10-39.
message SpaceTemplate {
  map<string, string> labels = 1;
  map<string, string> annotations = 2;

  SpaceType type = 10;
  Area area = 11;
  int32 floor = 12;
  int32 capacity = 13;
  bool bookable = 14;
}

// ---------------------------------------------------------------------------
// Property
// ---------------------------------------------------------------------------

// A property, and the owner of the Spaces inside it.
message Property {
  option (google.api.resource) = {
    type: "unmango.asset.property/Property"
    pattern: "{property}"
    singular: "property"
    plural: "properties"
  };
  string name = 1 [(google.api.field_behavior) = IMMUTABLE];
  string uid = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string display_name = 3 [(google.api.field_behavior) = OPTIONAL];
  map<string, string> labels = 4;
  map<string, string> annotations = 5;
  repeated k8s.io.apimachinery.pkg.apis.meta.v1.OwnerReference owner_refs = 6;
  int64 generation = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp delete_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Desired state.
  PropertyType type = 10;
  google.type.PostalAddress address = 11;
  google.type.LatLng location = 12;
  TenureType tenure = 13;

  // Spaces to materialize. Editing this adds or removes rooms.
  repeated SpaceTemplate spaces = 14;

  // Which Spaces this Property claims.
  k8s.io.apimachinery.pkg.apis.meta.v1.LabelSelector selector = 15;

  int32 year_built = 16 [(google.api.field_behavior) = OPTIONAL];
  Area total_area = 17;
  google.type.Date acquired_date = 18 [(google.api.field_behavior) = OPTIONAL];
  google.type.Money purchase_price = 19;

  // The finance.account Account holding the mortgage or paying the rent.
  ref.v1alpha1.ObjectReference finance_account = 20 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "unmango.finance.account/Account"
  ];

  // No longer held. Retained for history.
  bool disposed = 21;

  // Observed state.
  int64 observed_generation = 50 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated k8s.io.apimachinery.pkg.apis.meta.v1.Condition conditions = 51 [(google.api.field_behavior) = OUTPUT_ONLY];
  int32 space_count = 52 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Most recent valuation, which drifts from purchase_price over time.
  google.type.Money estimated_value = 53 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.type.Date valuation_date = 54 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Open asset.maintenance WorkOrders whose subject is this Property or one
  // of its Spaces.
  int32 open_work_order_count = 55 [(google.api.field_behavior) = OUTPUT_ONLY];
}
