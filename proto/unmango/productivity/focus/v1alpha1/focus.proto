edition = "2024";

package unmango.productivity.focus.v1alpha1;

import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "k8s.io/apimachinery/pkg/apis/meta/v1/generated.proto";
import "unmango/ref/v1alpha1/ref.proto";

// A time-boxed block of work, and what actually broke it:
//
//   FocusSession -> Interruption
//
// calendar.event already books time; this is not that. FocusSession is the
// after-the-fact truth about what happened inside a block: planned duration
// against actual, energy before and after, and every point attention
// slipped, tagged by source through its owned Interruptions. That turns
// "I got distracted again" from a vague feeling into a pattern visible over
// time, which time of day, which distraction source, which task, worth
// doing something about.
//
// A FocusSession optionally points at a productivity.task Task through
// task, a plain pointer rather than ownership, the same shape Task uses for
// scheduled_event: several sessions may work the same task, and a session
// with no task at all is still a valid deep-work or body-doubling block.

// ---------------------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------------------

enum FocusTechnique {
  FOCUS_TECHNIQUE_UNSPECIFIED = 0;
  FOCUS_TECHNIQUE_POMODORO = 1;
  FOCUS_TECHNIQUE_TIMEBOXING = 2;

  // Co-working with another person present, in person or on a call, purely
  // for the accountability of being watched working.
  FOCUS_TECHNIQUE_BODY_DOUBLING = 3;

  FOCUS_TECHNIQUE_DEEP_WORK = 4;

  // Work until natural attention drop-off rather than a fixed interval.
  FOCUS_TECHNIQUE_FLOWTIME = 5;
}

enum FocusSessionStatus {
  FOCUS_SESSION_STATUS_UNSPECIFIED = 0;
  FOCUS_SESSION_STATUS_PLANNED = 1;
  FOCUS_SESSION_STATUS_IN_PROGRESS = 2;
  FOCUS_SESSION_STATUS_COMPLETED = 3;

  // Ended before planned_duration elapsed and without reaching intention.
  FOCUS_SESSION_STATUS_ABANDONED = 4;
}

// A coarse, always-cheap-to-set self-report, the same treatment
// journal.entry Mood gives affect. Magnitude rather than valence: energy
// is not good or bad, only available or not.
enum EnergyLevel {
  ENERGY_LEVEL_UNSPECIFIED = 0;
  ENERGY_LEVEL_DEPLETED = 1;
  ENERGY_LEVEL_LOW = 2;
  ENERGY_LEVEL_MODERATE = 3;
  ENERGY_LEVEL_HIGH = 4;
}

// Mirrors Mood's five-point scale.
enum FocusQuality {
  FOCUS_QUALITY_UNSPECIFIED = 0;
  FOCUS_QUALITY_VERY_LOW = 1;
  FOCUS_QUALITY_LOW = 2;
  FOCUS_QUALITY_MODERATE = 3;
  FOCUS_QUALITY_GOOD = 4;
  FOCUS_QUALITY_VERY_GOOD = 5;
}

enum InterruptionSource {
  INTERRUPTION_SOURCE_UNSPECIFIED = 0;

  // An unprompted thought or urge to switch tasks.
  INTERRUPTION_SOURCE_INTERNAL_THOUGHT = 1;

  INTERRUPTION_SOURCE_NOTIFICATION = 2;

  // Someone else initiated the break in focus.
  INTERRUPTION_SOURCE_PERSON = 3;

  // Noise, a passing sight, anything ambient rather than addressed to you.
  INTERRUPTION_SOURCE_ENVIRONMENT = 4;

  // Hunger, needing the bathroom, pain, fatigue.
  INTERRUPTION_SOURCE_PHYSICAL_NEED = 5;
}

// ---------------------------------------------------------------------------
// FocusSession
// ---------------------------------------------------------------------------

// One block of work, from intention through what actually happened.
message FocusSession {
  string name = 1 [(google.api.field_behavior) = IMMUTABLE];
  string uid = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string display_name = 3 [features.field_presence = EXPLICIT];
  map<string, string> labels = 4;
  map<string, string> annotations = 5;
  repeated k8s.io.apimachinery.pkg.apis.meta.v1.OwnerReference owner_refs = 6;
  int64 generation = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp delete_time = 9 [
    features.field_presence = EXPLICIT,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // Desired state.

  // The productivity.task Task this session works on. Unset for an
  // untargeted deep-work or body-doubling block.
  ref.v1alpha1.ObjectReference task = 10 [features.field_presence = EXPLICIT];

  FocusTechnique technique = 11;
  google.protobuf.Duration planned_duration = 12;
  google.protobuf.Timestamp planned_start_time = 13 [features.field_presence = EXPLICIT];

  // What "done" looks like for this block, decided before starting so
  // starting does not require also deciding this.
  string intention = 14 [features.field_presence = EXPLICIT];

  // The people.contact Contact co-working this session, for body doubling.
  ref.v1alpha1.ObjectReference companion = 15 [features.field_presence = EXPLICIT];

  EnergyLevel energy_before = 16;

  // Observed state.
  int64 observed_generation = 50 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated k8s.io.apimachinery.pkg.apis.meta.v1.Condition conditions = 51 [(google.api.field_behavior) = OUTPUT_ONLY];
  FocusSessionStatus status = 52 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp start_time = 53 [
    features.field_presence = EXPLICIT,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
  google.protobuf.Timestamp end_time = 54 [
    features.field_presence = EXPLICIT,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
  google.protobuf.Duration actual_duration = 55 [(google.api.field_behavior) = OUTPUT_ONLY];
  int32 interruption_count = 56 [(google.api.field_behavior) = OUTPUT_ONLY];
  EnergyLevel energy_after = 57 [(google.api.field_behavior) = OUTPUT_ONLY];
  FocusQuality focus_quality = 58 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ---------------------------------------------------------------------------
// Interruption
// ---------------------------------------------------------------------------

// One point a FocusSession's attention slipped.
message Interruption {
  string name = 1 [(google.api.field_behavior) = IMMUTABLE];
  string uid = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string display_name = 3 [features.field_presence = EXPLICIT];
  map<string, string> labels = 4;
  map<string, string> annotations = 5;

  // The FocusSession this interruption happened during.
  repeated k8s.io.apimachinery.pkg.apis.meta.v1.OwnerReference owner_refs = 6;

  int64 generation = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp delete_time = 9 [
    features.field_presence = EXPLICIT,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // Desired state.
  google.protobuf.Timestamp occurred_time = 10;
  InterruptionSource source = 11;
  string description = 12 [features.field_presence = EXPLICIT];

  // How long it pulled you away, if you resumed. Unset if it ended the
  // session instead.
  google.protobuf.Duration duration = 13 [features.field_presence = EXPLICIT];

  // Observed state.
  int64 observed_generation = 50 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated k8s.io.apimachinery.pkg.apis.meta.v1.Condition conditions = 51 [(google.api.field_behavior) = OUTPUT_ONLY];
}
