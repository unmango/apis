edition = "2024";

package unmango.pki.certificate.v1alpha1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/type/interval.proto";
import "k8s.io/apimachinery/pkg/apis/meta/v1/generated.proto";
import "unmango/ref/v1alpha1/ref.proto";

// Standing requests for certificates, and their executions:
//
//   CertificateRequest -> CertificateIssuance @ ci.job JobRun -> Certificate
//   Certificate >> Certificate                          (issuer chain)
//
// A CertificateRequest is the durable definition: these names, from this
// pki.issuer Issuer, with this policy. A CertificateIssuance is one signing
// attempt, owned by the CertificateRequest that materialized it, the same
// split codegen.conversion Conversion draws from ConversionRun and
// iac.stack Stack draws from Run. A Certificate is the immutable,
// content-addressed result: an issuance produces one, or fails.
//
// A CertificateIssuance binds to a ci.job JobRun rather than modelling its
// own execution, the same delegation codegen.conversion ConversionRun and
// iac.stack Run make: ci already models a unit of work, its execution, and
// its placement on capacity. The binding chain runs
// CertificateIssuance -> JobRun -> Runner -> Host, and this domain owns only
// the first hop; an ACME challenge or a Vault sign call is what runs there.
//
// There is no run template, the same reason iac.stack Stack and
// codegen.conversion Conversion have none: a CertificateRequest already
// carries the real specification, so a CertificateIssuance snapshots it at
// creation. That snapshot is what keeps a finished issuance reproducible
// after its CertificateRequest is edited.
//
// Certificate is the third use of the `>>` archetype, alongside
// vcs.commit Commit and codegen.artifact Artifact: a signed certificate is
// immutable once minted, reissuing produces a different one, and
// issuer_fingerprint is fixed at creation because the issuing certificate's
// identity is part of what a conforming chain-of-trust covers. Field bands
// here match those two rather than the mutable kinds:
//   1-9    content-addressed identity
//   10-39  content, fixed at creation and covered by the fingerprint
//   50+    derived, computed by whoever indexes the graph
//
// Private key material is deliberately absent, the same reason commit bytes
// are absent from vcs.commit and generated bytes are absent from
// codegen.artifact: material_uri is a dev.unmango.protofs root, and reading
// or provisioning the actual PEM bytes is an ordinary filesystem operation
// this API does not restate.

// ---------------------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------------------

// A cryptographic key algorithm. Closed, unlike Platform or an open-string
// format: an implementer needs an actual branch of code per value, the same
// reason codegen.converter InvocationKind stays closed.
enum KeyAlgorithm {
  KEY_ALGORITHM_UNSPECIFIED = 0;
  KEY_ALGORITHM_RSA = 1;
  KEY_ALGORITHM_ECDSA = 2;
  KEY_ALGORITHM_ED25519 = 3;
}

// X.509 extended key usage. Closed for the same reason KeyAlgorithm is.
enum CertificateUsage {
  CERTIFICATE_USAGE_UNSPECIFIED = 0;
  CERTIFICATE_USAGE_SERVER_AUTH = 1;
  CERTIFICATE_USAGE_CLIENT_AUTH = 2;
  CERTIFICATE_USAGE_CODE_SIGNING = 3;
  CERTIFICATE_USAGE_EMAIL_PROTECTION = 4;
}

// Lifecycle of a CertificateIssuance.
enum CertificateIssuancePhase {
  CERTIFICATE_ISSUANCE_PHASE_UNSPECIFIED = 0;

  // Created, no ci.job JobRun bound yet.
  CERTIFICATE_ISSUANCE_PHASE_PENDING = 1;

  CERTIFICATE_ISSUANCE_PHASE_RUNNING = 2;
  CERTIFICATE_ISSUANCE_PHASE_SUCCEEDED = 3;
  CERTIFICATE_ISSUANCE_PHASE_FAILED = 4;
  CERTIFICATE_ISSUANCE_PHASE_CANCELLED = 5;
}

// ---------------------------------------------------------------------------
// CertificateRequest
// ---------------------------------------------------------------------------

// A standing request for a certificate, reissued once its Certificate's
// remaining lifetime crosses renew_before.
message CertificateRequest {
  option (google.api.resource) = {
    type: "unmango.pki.certificate/CertificateRequest"
    pattern: "{certificate_request}"
    singular: "certificateRequest"
    plural: "certificateRequests"
  };
  string name = 1 [(google.api.field_behavior) = IMMUTABLE];
  string uid = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string display_name = 3 [(google.api.field_behavior) = OPTIONAL];
  map<string, string> labels = 4;
  map<string, string> annotations = 5;
  repeated k8s.io.apimachinery.pkg.apis.meta.v1.OwnerReference owner_refs = 6;
  int64 generation = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Last write, server-stamped.
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp delete_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Desired state.
  // The pki.issuer Issuer to request from.
  ref.v1alpha1.ObjectReference issuer = 11 [(google.api.resource_reference).type = "unmango.pki.issuer/Issuer"];

  repeated string dns_names = 12;
  string common_name = 13 [(google.api.field_behavior) = OPTIONAL];
  repeated string ip_addresses = 14;
  KeyAlgorithm key_algorithm = 15;

  // Bits, meaningful only for KEY_ALGORITHM_RSA.
  int32 key_size = 16 [(google.api.field_behavior) = OPTIONAL];

  google.protobuf.Duration duration = 17;

  // Reissue once the current Certificate's remaining lifetime falls below
  // this.
  google.protobuf.Duration renew_before = 18;

  repeated CertificateUsage usages = 19;

  // The requested certificate can itself sign, the X.509 basic-constraints
  // CA bit.
  bool is_ca = 20;

  // A dev.unmango.protofs path the issued material is written to.
  string output_uri = 21 [(google.api.field_behavior) = OPTIONAL];

  // Observed state.
  int64 observed_generation = 50 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated k8s.io.apimachinery.pkg.apis.meta.v1.Condition conditions = 51 [(google.api.field_behavior) = OUTPUT_ONLY];
  ref.v1alpha1.ObjectReference latest_issuance = 52 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "unmango.pki.certificate/CertificateIssuance"
  ];

  // Fingerprint of the Certificate the latest successful issuance produced.
  string current_certificate_fingerprint = 53 [(google.api.field_behavior) = OUTPUT_ONLY];

  int32 issuance_count = 54 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp last_issuance_time = 55 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp next_renewal_time = 56 [(google.api.field_behavior) = OUTPUT_ONLY];

  // current_certificate_fingerprint has crossed renew_before, or does not yet
  // exist.
  bool renewal_due = 57 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ---------------------------------------------------------------------------
// CertificateIssuance
// ---------------------------------------------------------------------------

// One signing attempt for a CertificateRequest.
message CertificateIssuance {
  option (google.api.resource) = {
    type: "unmango.pki.certificate/CertificateIssuance"
    pattern: "{certificate_issuance}"
    singular: "certificateIssuance"
    plural: "certificateIssuances"
  };
  string name = 1 [(google.api.field_behavior) = IMMUTABLE];
  string uid = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string display_name = 3 [(google.api.field_behavior) = OPTIONAL];
  map<string, string> labels = 4;
  map<string, string> annotations = 5;

  // The CertificateRequest that materialized this issuance.
  repeated k8s.io.apimachinery.pkg.apis.meta.v1.OwnerReference owner_refs = 6;

  int64 generation = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Last write, server-stamped.
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp delete_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Desired state, snapshotted from the CertificateRequest at creation so the
  // issuance stays reproducible after the request is edited.
  ref.v1alpha1.ObjectReference issuer = 11 [(google.api.resource_reference).type = "unmango.pki.issuer/Issuer"];
  repeated string dns_names = 12;
  string common_name = 13 [(google.api.field_behavior) = OPTIONAL];
  repeated string ip_addresses = 14;
  KeyAlgorithm key_algorithm = 15;
  int32 key_size = 16 [(google.api.field_behavior) = OPTIONAL];
  google.protobuf.Duration duration = 17;
  repeated CertificateUsage usages = 18;
  bool is_ca = 19;
  string output_uri = 20 [(google.api.field_behavior) = OPTIONAL];

  // Assigned desired state.
  // The ci.job JobRun executing this issuance. Unset while pending, exactly
  // as an unscheduled Pod has no node.
  ref.v1alpha1.ObjectReference job_run = 40 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "unmango.ci.job/JobRun"
  ];

  // Observed state.
  int64 observed_generation = 50 [(google.api.field_behavior) = OUTPUT_ONLY];
  CertificateIssuancePhase phase = 51 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated k8s.io.apimachinery.pkg.apis.meta.v1.Condition conditions = 52 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp start_time = 53 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp completion_time = 54 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Fingerprint of the Certificate this issuance produced.
  string certificate_fingerprint = 55 [(google.api.field_behavior) = OUTPUT_ONLY];

  int32 attempt = 56 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Detail on failure: an ACME challenge rejection, a Vault error.
  string error_reason = 57 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ---------------------------------------------------------------------------
// Certificate
// ---------------------------------------------------------------------------

// One content-addressed, issued X.509 certificate.
//
// The identity band reserves what an immutable node has no use for,
// display_name, owner_refs, generation, update_time, and delete_time, rather
// than compacting around them, so 4 is labels, 5 is annotations, and 8 is
// create_time here exactly as on every mutable kind.
message Certificate {
  option (google.api.resource) = {
    type: "unmango.pki.certificate/Certificate"
    pattern: "{certificate}"
    singular: "certificate"
    plural: "certificates"
  };
  // Content-addressed identity.
  // SHA-256 over the DER-encoded certificate: "sha256:...". There is no
  // separate name, display_name, or owner_refs: nothing declares a
  // Certificate, so there is nothing to name it or own it.
  string fingerprint = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  string uid = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  map<string, string> labels = 4;
  map<string, string> annotations = 5;
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  reserved 3, 6, 7, 9, 10; // display_name, owner_refs, generation, update_time, delete_time: nothing declares, owns, or rewrites a certificate

  // Content, fixed at creation and covered by the fingerprint.
  string serial_number = 11;
  repeated string dns_names = 12;
  string common_name = 13 [(google.api.field_behavior) = OPTIONAL];
  repeated string ip_addresses = 14;
  KeyAlgorithm key_algorithm = 15;
  repeated CertificateUsage usages = 16;
  bool is_ca = 17;
  google.protobuf.Timestamp not_before = 18;
  google.protobuf.Timestamp not_after = 19;

  // The pki.issuer Issuer that minted this.
  ref.v1alpha1.ObjectReference issuer = 20 [(google.api.resource_reference).type = "unmango.pki.issuer/Issuer"];

  // Fingerprint of the Certificate that signed this one. The `>>` edge,
  // fixed at creation because the signer's identity is part of what a
  // conforming chain-of-trust covers. Unset for a self-signed root.
  string issuer_fingerprint = 21 [(google.api.field_behavior) = OPTIONAL];

  // A dev.unmango.protofs root holding the issued material.
  string material_uri = 22 [(google.api.field_behavior) = OPTIONAL];

  // Derived, computed by whoever indexes the graph.
  repeated k8s.io.apimachinery.pkg.apis.meta.v1.Condition conditions = 50 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The CertificateIssuances that reached this fingerprint. Repeated and
  // derived rather than content, the same reason
  // codegen.artifact Artifact.produced_by is: a retried issuance can reach an
  // identical certificate only by coincidence of inputs, and which attempt
  // got there first is not part of the identity.
  repeated ref.v1alpha1.ObjectReference issued_by = 51 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "unmango.pki.certificate/CertificateIssuance"
  ];

  bool revoked = 52 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp revoke_time = 53 [(google.api.field_behavior) = OUTPUT_ONLY];
  string revocation_reason = 54 [(google.api.field_behavior) = OUTPUT_ONLY];

  // not_after has passed.
  bool expired = 55 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ---------------------------------------------------------------------------
// CertificateService
// ---------------------------------------------------------------------------

// Read-only, the same reason vcs.commit CommitService and
// codegen.artifact ArtifactService are: creating, editing, and deleting are
// not operations that exist for a content-addressed object.
service CertificateService {
  rpc GetCertificate(GetCertificateRequest) returns (GetCertificateResponse);
  rpc ListCertificates(ListCertificatesRequest) returns (ListCertificatesResponse);
  rpc WatchCertificates(WatchCertificatesRequest) returns (stream WatchCertificatesResponse);

  // Walk the issuer chain from a leaf toward its root, the trust-graph
  // equivalent of vcs.commit WalkCommits and codegen.artifact WalkInputs.
  rpc WalkChain(WalkChainRequest) returns (stream WalkChainResponse);
}

message GetCertificateRequest {
  // Full or abbreviated fingerprint.
  string fingerprint = 1;
}

message GetCertificateResponse {
  Certificate certificate = 1;
}

message ListCertificatesRequest {
  int32 page_size = 1;
  string page_token = 2;
  k8s.io.apimachinery.pkg.apis.meta.v1.LabelSelector selector = 3;

  // Field 4 is `issuer` rather than the `owner` this position holds on every
  // mutable kind. A certificate has no owner reference to list by; the
  // issuer is provenance, not ownership.
  ref.v1alpha1.ObjectReference issuer = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "unmango.pki.issuer/Issuer"
  ];

  repeated string dns_names = 5;

  // Restricts results to certificates whose not_before falls within this
  // window.
  google.type.Interval window = 6;

  bool revoked_only = 7;
  bool expired_only = 8;
}

message ListCertificatesResponse {
  repeated Certificate certificates = 1;
  string next_page_token = 2;
}

message WatchCertificatesRequest {
  k8s.io.apimachinery.pkg.apis.meta.v1.LabelSelector selector = 1;
  ref.v1alpha1.ObjectReference issuer = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "unmango.pki.issuer/Issuer"
  ];

  // Resume from this point instead of the current state, so a client that
  // drops the stream does not have to replay from nothing. Unset starts from
  // now.
  string resource_version = 3 [(google.api.field_behavior) = OPTIONAL];
}

message WatchCertificatesResponse {
  CertificateEventType type = 1;
  Certificate certificate = 2;
}

// A certificate is never modified, so the event set matches vcs.commit and
// codegen.artifact. ADDED is a certificate becoming visible; REVOKED is one
// whose revoked field flipped; DELETED is one purged after expiring.
enum CertificateEventType {
  CERTIFICATE_EVENT_TYPE_UNSPECIFIED = 0;
  CERTIFICATE_EVENT_TYPE_ADDED = 1;
  CERTIFICATE_EVENT_TYPE_REVOKED = 2;
  CERTIFICATE_EVENT_TYPE_DELETED = 3;
}

message WalkChainRequest {
  // Fingerprint to walk from.
  string start_fingerprint = 1;
}

message WalkChainResponse {
  Certificate certificate = 1;

  // Edges traversed from start_fingerprint to reach this certificate.
  int32 depth = 2;
}
